services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tennis_quant
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - tennis_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis -d tennis_quant"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tennis_pg:

