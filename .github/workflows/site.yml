name: Atualizar site

on:
  schedule:
    - cron: "17 */3 * * *"   # de 3 em 3 horas (UTC)
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt -c constraints.txt
      - run: python -m pytest -q
      # TEMPORÁRIO: diagnóstico do que a ESPN devolve ao runner.
      - name: Sondar ESPN
        continue-on-error: true
        run: |
          python - > probe.log 2>&1 <<'PY'
          import httpx
          UA = "Mozilla/5.0 (compatible; TennisQuant/0.3; personal research)"
          for url in ["https://www.espn.com/tennis/scoreboard/_/date/20260930",
                      "https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard?dates=20260930"]:
              try:
                  r = httpx.get(url, headers={"User-Agent": UA}, follow_redirects=True, timeout=20)
                  b = r.text
                  print(r.status_code, str(r.url)[:90], r.headers.get("content-type"), len(b), "espnfitt" in b, repr(b[:200]))
              except Exception as e:
                  print(url[:60], type(e).__name__, e)
          PY
          echo "::notice title=probe ESPN::$(awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0}' probe.log)"
      # Falha se a ESPN não responder: o site anterior fica no ar.
      # Em caso de erro, as últimas linhas vão para uma anotação (visível sem iniciar sessão).
      - name: Exportar snapshot
        run: |
          if ! python scripts/export_snapshot.py --bootstrap > export.log 2>&1; then
            cat export.log
            echo "::error title=export_snapshot falhou::$(tail -n 30 export.log | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0}')"
            exit 1
          fi
          cat export.log
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Build do site estático
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          node lib/parlay.test.mjs
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
