name: Atualizar site

on:
  schedule:
    - cron: "17 */3 * * *"   # de 3 em 3 horas (UTC)
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt -c constraints.txt
      - run: python -m pytest -q
      # Falha se a ESPN não responder: o site anterior fica no ar.
      - run: python scripts/export_snapshot.py --bootstrap
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Build do site estático
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          node lib/parlay.test.mjs
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
